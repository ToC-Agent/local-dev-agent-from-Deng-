[project]
name = "local-dev-agent"
version = "0.1.0"
description = "Windows 本机 Local Developer Agent（M0–M4）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
local-dev-agent = "local_dev_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["local_dev_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
